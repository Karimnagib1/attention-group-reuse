# Overlay on mmluprox.yaml. All paths are derived from the model and dataset.
data:
  dataset_name: facebook/belebele
  subsets: [eng_Latn, spa_Latn, deu_Latn, rus_Cyrl, acm_Arab]
  languages: [eng_Latn, spa_Latn, deu_Latn, rus_Cyrl, acm_Arab]
  context_field: flores_passage
  option_fields: [mc_answer1, mc_answer2, mc_answer3, mc_answer4]
  answer_index_field: correct_answer_num
  answer_index_offset: -1
  answer_field: null
  id_fields: [link, question_number]
  id_separator: "::"
  language_field: dialect
  drop_columns: [ds]

eval:
  option_labels: [A, B, C, D]
  prompt_template: |-
    Passage: {passage}
    Question: {question}
    Options:
    {options}
    {answer_prefix}
